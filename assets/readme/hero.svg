<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">新家 3D 全景 — 两室一厅 Three.js 户型漫游</title>
  <desc id="desc">暖黑底标题：新家 3D 全景，两室一厅按户型图 1:1 还原；右侧是户型平面示意，8 个房间分区标注：厨房、卫生间、次卧、餐厅、书房、客厅、主卧、阳台。</desc>

  <rect width="1200" height="360" rx="26" fill="#131110"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#a39e93">THREE.JS · 3D 户型漫游 · WALKTHROUGH</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#d8c690">新家 3D 全景</text>
    <text x="56" y="168" font-size="23" fill="#e8e4da">两室一厅，按户型图 1:1 还原</text>
    <text x="56" y="204" font-size="19" fill="#a39e93">8 个房间、9 个视角，拖拽漫游，点家具看介绍。</text>
    <g id="chips" font-size="18" fill="#e8e4da" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#211d19" stroke="#4a4238" stroke-width="1.5"/><text x="119" y="262">8 个房间</text></g>
      <g><rect x="194" y="238" width="126" height="36" rx="18" fill="#211d19" stroke="#4a4238" stroke-width="1.5"/><text x="257" y="262">9 个视角</text></g>
      <g><rect x="332" y="238" width="176" height="36" rx="18" fill="#211d19" stroke="#4a4238" stroke-width="1.5"/><text x="420" y="262">白天 / 夜晚</text></g>
      <g><rect x="520" y="238" width="100" height="36" rx="18" fill="#211d19" stroke="#4a4238" stroke-width="1.5"/><text x="570" y="262">零构建</text></g>
    </g>
    <text x="56" y="316" font-size="17" fill="#a39e93">户型 7.34 × 10.66 m · 层高 2.8 m · Three.js 0.160</text>
  </g>

  <g id="floor-plan" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" text-anchor="middle">
    <!-- L 形外轮廓：西侧南半部缺角 -->
    <polygon points="780,24 1150,24 1150,336 945,336 945,196 780,196" fill="#211d19" stroke="#d8c690" stroke-width="2.5"/>
    <!-- 北排 -->
    <line x1="885" y1="24" x2="885" y2="104" stroke="#d8c690" stroke-width="2"/>
    <line x1="1000" y1="24" x2="1000" y2="104" stroke="#d8c690" stroke-width="2"/>
    <line x1="780" y1="104" x2="1150" y2="104" stroke="#d8c690" stroke-width="2"/>
    <!-- 中排 -->
    <line x1="945" y1="104" x2="945" y2="196" stroke="#d8c690" stroke-width="2"/>
    <line x1="945" y1="196" x2="1150" y2="196" stroke="#d8c690" stroke-width="2"/>
    <!-- 东侧下排 -->
    <line x1="945" y1="246" x2="1150" y2="246" stroke="#d8c690" stroke-width="2"/>
    <line x1="945" y1="296" x2="1150" y2="296" stroke="#d8c690" stroke-width="2"/>
    <!-- 房名 -->
    <g fill="#e8e4da">
      <text x="832" y="70">厨房</text>
      <text x="942" y="70">卫生间</text>
      <text x="1075" y="70">次卧</text>
      <text x="862" y="156">餐厅</text>
      <text x="1047" y="156">书房</text>
      <text x="1047" y="227">客厅</text>
      <text x="1047" y="277">主卧</text>
    </g>
    <text x="1047" y="322" fill="#d8c690">阳台</text>
    <!-- 指北针 -->
    <g transform="translate(800 320)">
      <circle r="12" fill="none" stroke="#a39e93" stroke-width="1.5"/>
      <polygon points="0,-8 4,6 -4,6" fill="#d8c690"/>
      <text x="20" y="5" font-size="16" fill="#a39e93" text-anchor="start">北</text>
    </g>
  </g>
</svg>
